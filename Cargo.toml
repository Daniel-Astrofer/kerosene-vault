[package]
name = "kerosene-vault"
version = "0.1.0"
edition = "2021"
description = "Kerosene vault mesh node (Clean Architecture skeleton — F0/F1)"
license = "UNLICENSED"
publish = false

[features]
default = ["dealer_lab"]
dealer_lab = []
production = []
# Compiles SEV/SGX HW seal + attestation quote verify structure (SEV via sev-snp-utilities).
# Runtime still fail-closed without /dev/sev-guest or an SGX enclave/SDK. Not enabled in default CI.
tee_hw = ["dep:sev-snp-utilities"]

[[bin]]
name = "kerosene-vault"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
bitcoin = "0.32"
chacha20poly1305 = "0.10"
frost-secp256k1 = "3"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pemfile = "2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sev-snp-utilities = { version = "2.600.0", optional = true }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
zeroize = "1"

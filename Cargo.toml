[package]
name = "kerosene-vault"
version = "0.1.0"
edition = "2021"
description = "Kerosene vault mesh node (Clean Architecture skeleton — F0/F1)"
license = "UNLICENSED"
publish = false

[features]
default = ["dealer_lab"]
dealer_lab = []
production = []

[[bin]]
name = "kerosene-vault"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.8"
bitcoin = "0.32"
chacha20poly1305 = "0.10"
frost-secp256k1 = "3"
hex = "0.4"
rand = "0.8"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
zeroize = "1"

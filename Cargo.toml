[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
kerosene-contracts = { git = "https://github.com/Daniel-Astrofer/kerosene-contracts.git", rev = "5ab7bc130f71b9316ec5ff4adb7b98d3d9e4fc20" }

[package]
name = "kerosene-vault"
version = "0.1.0"
edition = "2021"
description = "Kerosene vault mesh node — thin binary wrapper"
license = "UNLICENSED"
publish = false

[features]
default = []
dealer_lab = ["vault-core/dealer_lab"]
production = ["vault-core/production"]
hybrid = ["vault-core/hybrid"]
tee_hw = ["vault-core/tee_hw"]
tpm = ["vault-core/tpm"]

[[bin]]
name = "kerosene-vault"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dev-dependencies]
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
vault-core = { path = "crates/vault-core" }
vault-identity-core = { path = "crates/vault-identity-core" }

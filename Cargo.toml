[package]
name = "kerosene-vault"
version = "0.1.0"
edition = "2021"
description = "Kerosene vault mesh node (Clean Architecture skeleton — F0/F1)"
license = "UNLICENSED"
publish = false

[features]
default = []
dealer_lab = []
production = []
# Enables the mandatory hybrid classical + post-quantum suite in CI/release builds.
# The implementation is compiled unconditionally today; this named feature is the
# stable packaging contract used by production automation.
hybrid = []
# Compiles SEV/SGX HW seal + attestation quote verify structure (SEV via sev-snp-utilities).
# Runtime still fail-closed without /dev/sev-guest or an SGX enclave/SDK. Not enabled in default CI.
tee_hw = ["dep:sev-snp-utilities"]
# Compiles TPM 2.0 TSS seal/unseal path for domestic hardware protection.
# Requires system libs: libtss2-esys, libtss2-tcti-device (Debian/Ubuntu).
# Runtime fail-closed without /dev/tpmrm0 or /dev/tpm0. Not enabled in default CI.
# Enables the current TPM2-tools-backed TSS adapter. A future native tss-esapi
# dependency can be added here without changing the release feature contract.
tpm = []

[[bin]]
name = "kerosene-vault"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
aead = "0.5"
argon2 = "0.5"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
bitcoin = { version = "0.32", features = ["base64"] }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
frost-secp256k1 = "3"
frost-secp256k1-tr = "3"
futures-util = "0.3"
hkdf = "0.12"
hex = "0.4"
ml-dsa = "0.1"
ml-kem = "0.3"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "socks"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-pemfile = "2"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sev-snp-utilities = { version = "2.600.0", optional = true }
sha2 = "0.10"
sha3 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-rustls = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "limit"] }
x25519-dalek = "2"
x509-parser = "0.16"
zeroize = "1"
